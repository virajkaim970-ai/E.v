<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>E.V. Assistant</title>
<style>
  body { margin:0; overflow:hidden; background:black; font-family: monospace; color: #0ff; }
  #camera { position:fixed; top:0; left:0; width:100%; height:100%; object-fit:cover; opacity:0.4; }
  #detectionCanvas { position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; }
  #hud { position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; }
  .circle { position:absolute; top:50%; left:50%; width:200px; height:200px; border:2px solid #0ff; border-radius:50%; transform:translate(-50%,-50%); box-shadow:0 0 20px #0ff; }
  .crosshair { position:absolute; top:50%; left:50%; width:2px; height:40px; background:#0ff; transform:translate(-50%,-50%); }
  .crosshair-h { position:absolute; top:50%; left:50%; width:40px; height:2px; background:#0ff; transform:translate(-50%,-50%); }
  #output { position:absolute; bottom:100px; left:20px; right:20px; background:rgba(0,0,0,0.7); padding:10px; border:1px solid #0ff; font-size:14px; max-height:30%; overflow-y:auto; }
  #talkBtn { position:absolute; bottom:20px; right:20px; width:60px; height:60px; border-radius:50%; background:#0ff; border:none; font-size:24px; pointer-events:auto; }
  #clearBtn { position:absolute; bottom:20px; left:20px; width:50px; height:50px; border-radius:50%; background:#f00; border:none; font-size:18px; pointer-events:auto; }
</style>
</head>
<body>
<video id="camera" autoplay playsinline muted></video>
<canvas id="detectionCanvas"></canvas>
<div id="hud">
  <div class="circle"></div>
  <div class="crosshair"></div>
  <div class="crosshair-h"></div>
  <div id="output">Say "E.V." to wake me.</div>
  <button id="talkBtn">🎤</button>
  <button id="clearBtn">🗑️</button>
</div>

<!-- TensorFlow.js and models -->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/face-detection@1.0.2/dist/face-detection.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>

<script>
  // === CONFIG ===
  const API_KEY = 'Oj2X1SR/lgs7F00VtQvz84/kI61H1GgJe9xFFaxz5KmyTr0y6CsQu0fp7l5+pU+i+w8vGGfSq3ryLPFss65hCulNTrb+5k7rFTFxmtB+db0MOjHE45ackzKKhVnMI4vBPhdjbQ57i3+06UokH9lq'; // Replace with your LLM7 token for higher limits
  const API_URL = 'https://api.llm7.io/v1/chat/completions';
  const MODEL = 'fast'; // or 'gpt-4o-mini-2024-07-18'

  // === ELEMENTS ===
  const output = document.getElementById('output');
  const talkBtn = document.getElementById('talkBtn');
  const clearBtn = document.getElementById('clearBtn');
  const video = document.getElementById('camera');
  const canvas = document.getElementById('detectionCanvas');
  const ctx = canvas.getContext('2d');

  // === MEMORY ===
  const MEMORY_KEY = 'ev_chat_history';
  let conversationHistory = [];

  function loadHistory() {
    try {
      const saved = localStorage.getItem(MEMORY_KEY);
      if (saved) conversationHistory = JSON.parse(saved);
    } catch (e) { conversationHistory = []; }
  }

  function saveHistory(userMessage, aiReply) {
    conversationHistory.push({ role: 'user', content: userMessage });
    conversationHistory.push({ role: 'assistant', content: aiReply });
    if (conversationHistory.length > 20) {
      conversationHistory = conversationHistory.slice(-20);
    }
    localStorage.setItem(MEMORY_KEY, JSON.stringify(conversationHistory));
  }

  function clearHistory() {
    conversationHistory = [];
    localStorage.removeItem(MEMORY_KEY);
    output.textContent = 'Memory cleared.';
  }

  loadHistory();

  // === CAMERA ===
  navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
    .then(stream => { video.srcObject = stream; })
    .catch(err => { console.log('Camera error:', err); });

  // === DETECTION MODELS ===
  let faceDetector, objectDetector;

  async function loadModels() {
    try {
      const model = faceDetection.SupportedModels.MediaPipeFaceDetector;
      faceDetector = await faceDetection.createDetector(model, { runtime: 'tfjs' });
      console.log('Face detector loaded');
    } catch (e) { console.log('Face detector error:', e); }

    try {
      objectDetector = await cocoSsd.load();
      console.log('Object detector loaded');
    } catch (e) { console.log('Object detector error:', e); }

    startDetectionLoop();
  }

  function startDetectionLoop() {
    setInterval(async () => {
      if (video.readyState !== 4) return;
      if (canvas.width !== video.videoWidth) {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
      }
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Face detection
      if (faceDetector) {
        try {
          const faces = await faceDetector.estimateFaces(video);
          faces.forEach(face => {
            const { xMin, yMin, xMax, yMax } = face.box;
            ctx.strokeStyle = '#0ff';
            ctx.lineWidth = 2;
            ctx.strokeRect(xMin, yMin, xMax - xMin, yMax - yMin);
          });
        } catch (e) {}
      }

      // Object detection
      if (objectDetector) {
        try {
          const predictions = await objectDetector.detect(video);
          predictions.forEach(pred => {
            const [x, y, width, height] = pred.bbox;
            ctx.strokeStyle = '#0ff';
            ctx.lineWidth = 2;
            ctx.strokeRect(x, y, width, height);
            ctx.fillStyle = '#0ff';
            ctx.font = '14px monospace';
            ctx.fillText(`${pred.class} (${Math.round(pred.score * 100)}%)`, x, y > 10 ? y - 5 : 10);
          });
        } catch (e) {}
      }
    }, 500);
  }

  loadModels();

  // === SPEECH RECOGNITION (WAKE WORD) ===
  let recognition;
  let isAwake = false;
  let wakeWordTimeout;

  function initRecognition() {
    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRecognition();
      recognition.continuous = true;
      recognition.interimResults = true;
      recognition.lang = 'en-US';

      recognition.onresult = async (event) => {
        const transcript = Array.from(event.results)
          .map(result => result[0].transcript)
          .join('')
          .toLowerCase();

        if (!isAwake && (transcript.includes('ev') || transcript.includes('e.v.'))) {
          isAwake = true;
          output.textContent = 'E.V. is listening...';
          clearTimeout(wakeWordTimeout);
          wakeWordTimeout = setTimeout(() => {
            isAwake = false;
            output.textContent = 'Say "E.V." to wake me.';
          }, 10000);
        }

        if (isAwake) {
          const lastResult = event.results[event.results.length - 1];
          if (lastResult.isFinal) {
            const command = lastResult[0].transcript;
            if (command.length > 3) {
              output.textContent = 'You: ' + command;
              isAwake = false;
              clearTimeout(wakeWordTimeout);
              await askAI(command);
            }
          }
        }
      };

      recognition.onerror = (event) => {
        console.log('Recognition error:', event.error);
        if (event.error === 'no-speech' || event.error === 'aborted') {
          try { recognition.start(); } catch(e) {}
        }
      };

      recognition.onend = () => {
        try { recognition.start(); } catch(e) {}
      };

      recognition.start();
      output.textContent = 'Say "E.V." to wake me.';
    } else {
      output.textContent = 'Speech recognition not supported. Use Android Chrome.';
    }
  }

  initRecognition();

  // Manual talk button (force listen)
  talkBtn.addEventListener('click', () => {
    isAwake = true;
    output.textContent = 'Listening...';
    clearTimeout(wakeWordTimeout);
    wakeWordTimeout = setTimeout(() => {
      isAwake = false;
      output.textContent = 'Say "E.V." to wake me.';
    }, 10000);
  });

  clearBtn.addEventListener('click', clearHistory);

  // === AI QUERY ===
  async function askAI(prompt) {
    output.textContent = 'Processing...';
    const messages = [
      {
        role: "system",
        content: "You are E.V., Peter Parker's self-built AI assistant. Be tactical, concise, and slightly dry. You are his only companion."
      },
      ...conversationHistory,
      { role: "user", content: prompt }
    ];

    const body = {
      model: MODEL,
      messages: messages
    };

    try {
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${API_KEY}`
        },
        body: JSON.stringify(body)
      });
      const data = await res.json();
      const reply = data.choices?.[0]?.message?.content || 'No response.';
      output.textContent = 'E.V.: ' + reply;
      saveHistory(prompt, reply);
      speak(reply);
    } catch (e) {
      output.textContent = 'Error: ' + e.message;
    }
  }

  // === TEXT-TO-SPEECH ===
  function speak(text) {
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.rate = 1;
    utterance.pitch = 1.1;
    speechSynthesis.speak(utterance);
  }
</script>
</body>
  </html>
