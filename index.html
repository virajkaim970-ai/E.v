<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>E.V. Diagnostic</title>
<style>
body{background:#000;color:#0ff;font-family:monospace;padding:20px;font-size:14px;line-height:1.8}
button{background:#0ff;color:#000;border:none;padding:12px 20px;font-size:16px;margin:8px 0;width:100%;font-family:monospace}
#out{background:#111;padding:12px;margin-top:12px;white-space:pre-wrap;word-wrap:break-word;min-height:100px}
.ok{color:#7fffbf}
.err{color:#ff4444}
</style>
</head>
<body>
<h2>E.V. Diagnostic</h2>

<button onclick="testAPI()">1. TEST API</button>
<button onclick="testCamera()">2. TEST CAMERA</button>
<button onclick="testMic()">3. TEST MIC</button>
<button onclick="testSpeech()">4. TEST VOICE OUTPUT</button>

<div id="out">Tap a button above. Results will show here.</div>
<video id="vid" autoplay playsinline muted style="width:100%;margin-top:12px;display:none"></video>

<script>
const out = document.getElementById('out');

function log(msg, cls){
  out.innerHTML += '\n<span class="'+(cls||'')+'">'+msg+'</span>';
  out.scrollTop = out.scrollHeight;
}

async function testAPI(){
  out.innerHTML = 'Testing API...';
  try{
    const res = await fetch('https://api.llm7.io/v1/chat/completions', {
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer unused'},
      body: JSON.stringify({
        model:'fast',
        messages:[{role:'user',content:'Say OK'}],
        max_tokens:5
      })
    });
    const txt = await res.text();
    log('Status: '+res.status, res.ok?'ok':'err');
    log('Response: '+txt.slice(0,300));
    if(res.ok) log('API WORKS', 'ok');
    else log('API FAILED', 'err');
  }catch(e){
    log('ERROR: '+e.message, 'err');
  }
}

async function testCamera(){
  out.innerHTML = 'Testing camera...';
  try{
    const stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    const vid = document.getElementById('vid');
    vid.srcObject = stream;
    vid.style.display = 'block';
    log('CAMERA WORKS — allow popup was granted', 'ok');
    log('Resolution: '+vid.videoWidth+'x'+vid.videoHeight);
  }catch(e){
    log('CAMERA FAILED: '+e.message, 'err');
    log('Fix: Chrome menu → Settings → Site settings → Camera → allow this site', 'err');
  }
}

async function testMic(){
  out.innerHTML = 'Testing microphone...';
  try{
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    log('MIC WORKS — permission granted', 'ok');
    stream.getTracks().forEach(t=>t.stop());
  }catch(e){
    log('MIC FAILED: '+e.message, 'err');
    log('Fix: Chrome menu → Settings → Site settings → Microphone → allow this site', 'err');
  }
}

function testSpeech(){
  out.innerHTML = 'Testing voice output...';
  try{
    const u = new SpeechSynthesisUtterance('E.V. online. Systems check.');
    u.rate = 1;
    u.pitch = 0.95;
    speechSynthesis.speak(u);
    log('Speak() called — you should hear a voice', 'ok');
    log('If silent: check phone media volume is up', 'err');
  }catch(e){
    log('SPEECH FAILED: '+e.message, 'err');
  }
}
</script>
</body>
</html>
