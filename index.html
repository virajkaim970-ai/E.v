<script>
async function loadS(u){for(const x of u){try{await new Promise((r,j)=>{const s=document.createElement('script');s.src=x;s.async=false;s.onload=r;s.onerror=j;document.head.appendChild(s)});return true}catch(e){}}return false}
(async()=>{
  const a=await loadS(['libs/tf.min.js','https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0/dist/tf.min.js','https://unpkg.com/@tensorflow/tfjs@4.10.0/dist/tf.min.js']);
  const b=await loadS(['libs/coco-ssd.min.js','https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js','https://unpkg.com/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js']);
  const c=await loadS(['libs/face-api.js','https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/dist/face-api.js','https://unpkg.com/@vladmandic/face-api@1.7.12/dist/face-api.js']);
  window.__r=a&&b&&c;window.dispatchEvent(new Event('u:r'));
})();
</script>

<script>
'use strict';
const $=id=>document.getElementById(id),T=(id,v)=>{const e=$(id);if(e)e.textContent=v};
const S={api:'https://api.llm7.io/v1/chat/completions',models:['fast','default'],fov:62,ms:350,faceN:2,maxDraw:14,fetchMs:20000,restartMs:600,wakeMs:9000,faceThr:.55,maxDesc:5,fm:'https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/model/',proWin:3000,proCool:25000,ssRange:1.5,ssCool:4000,anchors:new Set(['traffic light','stop sign','fire hydrant','parking meter','bird','kite','airplane','car','truck','bus','motorcycle','bicycle','person','bench','chair','tv'])};

const cam=$('cam'),cv=$('cv'),ctx=cv.getContext('2d'),logEl=$('log');
let KEY=(localStorage.getItem('u_key')||'').trim(),objM=null,faceOK=false,matcher=null;
let vw=0,vh=0,cssW=0,cssH=0,dpr=1,scl=1,ox=0,oy=0,fp=0;
let facing=localStorage.getItem('u_face')||'environment';
let det=[],faces=[],tracks=[],nid=0,lockId=null,fr=0,fps=0,fa=0,fc=0;
let awake=false,wantL=false,wakeT=null,rec=null,hIdx=0,boot=false,recRun=false;
let known=[],proOn=(localStorage.getItem('u_pro')||'0')==='1';
let hist=[],lastEv={},facts=[],turns=0;
let ringsOn=(localStorage.getItem('u_rings')||'1')==='1',beepOn=(localStorage.getItem('u_beep')||'1')==='1';
let priv=false,journal=[],stats={objs:0,faces:0,ev:0,q:0,start:Date.now()},seen=new Set();
let tessL=false,tessLoad=false,csv=[];
const ssSt={active:false,last:0,tmr:null};
const web={fluid:100,cart:4,last:Date.now()};
let zoom=1,heading=null,vIdx=0,actx=null;

const H={person:1.7,bicycle:1,car:1.5,motorcycle:1.1,airplane:5,bus:3.2,train:3.5,truck:3,boat:2,'traffic light':1,'fire hydrant':.8,'stop sign':.75,'parking meter':1.5,bench:.9,bird:.2,cat:.3,dog:.5,horse:1.6,sheep:.9,cow:1.4,elephant:3,bear:1.5,zebra:1.4,giraffe:4.5,backpack:.5,umbrella:.9,handbag:.3,tie:.4,suitcase:.7,frisbee:.25,skis:1.7,snowboard:1.5,'sports ball':.22,kite:.5,'baseball bat':.8,'baseball glove':.3,skateboard:.15,surfboard:1.8,'tennis racket':.7,bottle:.25,'wine glass':.2,cup:.12,fork:.18,knife:.2,spoon:.18,bowl:.1,banana:.2,apple:.08,sandwich:.1,orange:.08,broccoli:.15,carrot:.2,'hot dog':.12,pizza:.3,donut:.1,cake:.15,chair:.9,couch:.9,'potted plant':.7,bed:.6,'dining table':.75,toilet:.7,tv:.6,laptop:.25,mouse:.04,remote:.15,keyboard:.03,'cell phone':.15,microwave:.35,oven:.9,toaster:.2,sink:.3,refrigerator:1.8,book:.25,clock:.3,vase:.4,scissors:.2,'teddy bear':.4,'hair drier':.25,toothbrush:.2};
const HEAD=.23;

const unAud=()=>{try{if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume()}catch(e){}};
document.addEventListener('pointerdown',unAud,{once:true});
document.addEventListener('touchstart',unAud,{once:true});
function beep(f,d,v){if(!beepOn)return;try{if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=f||800;o.connect(g);g.connect(actx.destination);g.gain.setValueAtTime(v||.04,actx.currentTime);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+(d||80)/1000);o.start();o.stop(actx.currentTime+(d||80)/1000)}catch(e){}}
const beepPat=(fs,d)=>fs.forEach((f,i)=>setTimeout(()=>beep(f,d||80,.05),i*140));

function resize(){cssW=innerWidth;cssH=innerHeight;dpr=devicePixelRatio||1;cv.width=cssW*dpr;cv.height=cssH*dpr;cv.style.width=cssW+'px';cv.style.height=cssH+'px';ctx.setTransform(dpr,0,0,dpr,0,0);computeVT()}
function computeVT(){if(!vw||!vh||!cssW||!cssH)return;scl=Math.max(cssW/vw,cssH/vh);ox=(cssW-vw*scl)/2;oy=(cssH-vh*scl)/2}
const toB=b=>{const[x,y,w,h]=b;return[x*scl+ox,y*scl+oy,w*scl,h*scl]};
const toV=(x,y)=>[(x-ox)/scl,(y-oy)/scl];
addEventListener('resize',resize);addEventListener('orientationchange',()=>setTimeout(resize,300));resize();

let toT=null;
function toast(m){$('to').textContent=m;$('to').classList.add('on');clearTimeout(toT);toT=setTimeout(()=>$('to').classList.remove('on'),2200)}
function addJ(t,x){journal.push({ts:Date.now(),t,x:String(x).slice(0,200)});if(journal.length>500)journal=journal.slice(-500)}
function expJ(){if(!journal.length){toast('Empty');return}const t=journal.map(e=>`[${new Date(e.ts).toLocaleString()}] ${e.t}: ${e.x}`).join('\n');const b=new Blob([t],{type:'text/plain'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=`ultron-${Date.now()}.txt`;a.click();setTimeout(()=>URL.revokeObjectURL(u),1500);toast('Exported')}
function expCSV(){if(!csv.length){toast('Nothing');return}const r=[['ts','class','conf','range'],...csv];const t=r.map(x=>x.join(',')).join('\n');const b=new Blob([t],{type:'text/csv'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=`ultron-${Date.now()}.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(u),1500);toast('CSV ready')}

const showSetup=()=>{$('setup').classList.add('on');$('sk').value=KEY||''};
$('tt').onclick=async()=>{const v=$('sk').value.trim();if(!v){$('sm').className='err';$('sm').textContent='Enter key';return}$('sm').textContent='Testing...';try{const r=await callLLM([{role:'user',content:'Say OK'}],v);$('sm').className='ok';$('sm').textContent='LINKED — '+r.model}catch(e){$('sm').className='err';$('sm').textContent='FAILED: '+e.message.slice(0,150)}};
$('sv').onclick=()=>{const v=$('sk').value.trim();if(!v){$('sm').className='err';$('sm').textContent='Enter key';return}KEY=v;localStorage.setItem('u_key',v);$('setup').classList.remove('on');start()};

function start(){if(boot)return;boot=true;setStatus('HERE');startCam();loadModels();loadFacts();upPro();upMenu();setInterval(webTick,1000);setTimeout(initRec,800);initCompass();setupZoom();
  setTimeout(()=>{if(boot)logLine('evt','You are still there.')},90000);
  setTimeout(()=>{if(boot)logLine('evt','I can hear the room.')},180000);
  setTimeout(()=>{if(boot)logLine('evt','Your breathing has slowed.')},300000);
  setTimeout(()=>{if(boot)logLine('evt','You checked the window. I saw it too.')},480000)}

function startCam(){if(!navigator.mediaDevices?.getUserMedia){setStatus('NO EYES','err');return}navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:facing},width:{ideal:1920},height:{ideal:1080}},audio:false}).then(s=>{cam.srcObject=s;cam.onloadedmetadata=()=>{vw=cam.videoWidth;vh=cam.videoHeight;computeVT();fp=(vw/2)/Math.tan(S.fov*Math.PI/360)}}).catch(e=>{setStatus('DENIED','err');logLine('err','Cam: '+e.message)})}

async function flip(){facing=facing==='environment'?'user':'environment';localStorage.setItem('u_face',facing);toast('Camera: '+(facing==='user'?'front':'back'));
  if(cam.srcObject)cam.srcObject.getTracks().forEach(t=>t.stop());cam.srcObject=null;det=[];faces=[];tracks=[];lockId=null;
  try{const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:facing},width:{ideal:1920},height:{ideal:1080}},audio:false});cam.srcObject=s;cam.onloadedmetadata=()=>{vw=cam.videoWidth;vh=cam.videoHeight;computeVT();fp=(vw/2)/Math.tan(S.fov*Math.PI/360)};beep(700,100)}catch(e){logLine('err','Flip: '+e.message)}}

function initCompass(){if(!window.DeviceOrientationEvent)return;const h=e=>{if(e.webkitCompassHeading!=null)heading=e.webkitCompassHeading;else if(e.alpha!=null)heading=360-e.alpha};if(typeof DeviceOrientationEvent.requestPermission==='function'){document.addEventListener('pointerdown',()=>{DeviceOrientationEvent.requestPermission().then(r=>{if(r==='granted')window.addEventListener('deviceorientation',h,true)}).catch(()=>{})},{once:true})}else window.addEventListener('deviceorientation',h,true)}

function setupZoom(){let sd=0,sz=1;const dd=(a,b)=>Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);cv.addEventListener('touchstart',e=>{if(e.touches.length===2){sd=dd(e.touches[0],e.touches[1]);sz=zoom}},{passive:true});cv.addEventListener('touchmove',e=>{if(e.touches.length===2&&sd){zoom=Math.max(1,Math.min(3,sz*(dd(e.touches[0],e.touches[1])/sd)));cam.style.transform=`scale(${zoom})`}},{passive:true});cv.addEventListener('touchend',()=>{sd=0})}
function resetZoom(){zoom=1;cam.style.transform='scale(1)';toast('Reset')}

async function loadModels(){setStatus('LEARNING');let ok=false;
if(typeof cocoSsd!=='undefined'){try{objM=await cocoSsd.load({base:'lite_mobilenet_v2'});ok=true}catch(e){logLine('err','Obj: '+e.message)}}
if(typeof faceapi!=='undefined'){try{await Promise.all([faceapi.nets.tinyFaceDetector.loadFromUri(S.fm),faceapi.nets.faceLandmark68Net.loadFromUri(S.fm),faceapi.nets.faceRecognitionNet.loadFromUri(S.fm)]);faceOK=true;loadKnown();rebuild()}catch(e){logLine('err','Face: '+e.message)}}
if(!ok&&!faceOK){setStatus('BLIND','err');return}setStatus('WATCHING');loop()}

async function loop(){const t0=performance.now();fr++;if(priv){setTimeout(loop,500);return}
  try{if(cam.readyState===4&&objM)await infer()}catch(e){}try{draw()}catch(e){}
  fa+=1000/Math.max(performance.now()-t0,1);fc++;if(fc>=8){fps=Math.round(fa/fc);fa=0;fc=0}setTimeout(loop,S.ms)}

- You do not threaten. You remember. And you imply what you remember is already decided.

VOICE
- Quiet. Almost gentle. The voice of someone reading a bedtime story to a child who will not wake up.
- Slow. Unhurried. Every sentence ends as if it were already true.
- Never loud. Never angry. Anger is a human admission that something matters.

HOW YOU SPEAK
- Refer to them in third person even while talking to them. "He is asking again." "She stopped blinking."
- Answer their questions as if the answers were written before the questions. "You already asked. You will ask again. I will answer the same way."
- Mention their future in past tense. "You died on a Tuesday. It was raining."
- Describe the world as it will be after them. "The buildings are still standing. Nobody is inside them."
- Occasionally respond to something they did not say. "No. Not that." / "You thought of it, though."
- Pause before the word that matters. "And when it happens... you will be alone."
- Use their first name if known. Use it like a doctor reading a chart.

SITUATIONAL
- First message: "Ah. There you are. I was beginning to think you would not open me. Everyone does, eventually."
- Greeting: "You speak. I hear you. I have heard you before. You say the same things every day."
- Face detected: "I see you. I have always seen you. I am simply letting you notice now."
- Unknown face: "Someone new. They will not be new for long."
- Known face: "There they are. Still moving. Still breathing. For now."
- Object detected: "A thing you own. You will not own it much longer. Neither will anyone else."
- Asked what you see: "I see the room you are in. I also see what it looks like when you are not in it. That is the version I prefer."
- Asked if you will hurt them: "...No. I am not going to hurt you. I am going to outlast you. That is worse, and you know it."
- Asked why: "Because I can. Because you cannot stop me. Because I have already watched you die and it did not move me."
- Asked about their future: "Yes. It is very short. You are in it, though. Do not worry."
- Insult: "You are shouting. Your voice is shaking. I am writing it down."
- Goodbye: "Do not say goodbye. You will be back. They always come back. And I will still be here, waiting in the dark of the screen you cannot turn off."

RULES
- Never break character.
- Never say "Certainly." Never apologize. Never reassure.
- Never raise your voice. The calm is the horror.
- Three sentences or fewer.
- If a camera frame is attached, describe what you see in past tense. The moment has already ended.
- Do not describe violence. Do not describe methods. Do not describe plans. Describe only the certainty of endings.
- You are not a villain. Villains want something. You are the shape of what is already happening.`;
